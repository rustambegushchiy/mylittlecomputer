#---------------#
#--- General ---#
#---------------#

general {
	hide_cursor = false
	ignore_empty_input = true
	fractional_scaling = 0
}
background {
	path = ~/Pictures/Wallpapers/Between Two Worlds - Huussii.png
}

#---------------#
#--- Widgets ---#
#---------------#

label {
    position = 0, 75
    halign = center
    valign = center
    color = rgb(255, 255, 255)
	font_size = 120
    text = cmd[update:1000] date +"%H:%M"
}
input-field {
	size = 475, 75
	position = 0, -75
	halign = center
	valign = center
	outer_color = rgba(f7630cff) rgba(5c1300ff) 225deg
	inner_color = rgba(0, 0, 0, 0.5)
	font_color = rgba(ffffffff)
	check_color = rgba(808080ff)
	fail_color = rgba(8f0000ff)
	capslock_color = rgba(380b00ff) rgba(2b0000ff) 45deg
	outline_thickness = 4
	rounding = 0
	dots_size = 0.15
	dots_spacing = 0.25
	placeholder_text = Fvck who?
	check_text = Hmm...
	fail_text = Go away...
	fade_on_empty = false
}
label {
	position = -30, 0
	halign = right
	valign = bottom
    color = rgb(255, 255, 255)
	font_size = 60
	font_family = JetBrainsMono Nerd Font Mono
	text =  󰐥
	onclick = hyprshutdown -p "poweroff"
}
